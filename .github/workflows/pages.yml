name: Deploy to GitHub Pages

# Builds the Vite app (relative base './') and deploys dist/ to GitHub Pages.
# Pages is NOT enabled on this repository. To use this workflow, the owner turns on
# Settings > Pages > Source: GitHub Actions, then either runs it by hand (Actions tab >
# Deploy to GitHub Pages > Run workflow) or sets the repository variable PAGES_ENABLED=true
# so every push to main deploys. Until then, pushes to main skip the deploy job.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
